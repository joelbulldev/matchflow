services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: matchflow
      MYSQL_USER: matchflow
      MYSQL_PASSWORD: matchflow
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mf_db:/var/lib/mysql
    ports:
      - "3306:3306"

  wordpress:
    image: wordpress:6.7-php8.2-apache
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: matchflow
      WORDPRESS_DB_PASSWORD: matchflow
      WORDPRESS_DB_NAME: matchflow
      MATCHFLOW_ALLOW_UNVERIFIED_QUOTES: "true"
    volumes:
      - mf_wp:/var/www/html
      - ./:/var/www/html/wp-content/plugins/matchflow

  wpcli:
    image: wordpress:cli-php8.2
    depends_on:
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: matchflow
      WORDPRESS_DB_PASSWORD: matchflow
      WORDPRESS_DB_NAME: matchflow
    volumes:
      - mf_wp:/var/www/html
      - ./:/var/www/html/wp-content/plugins/matchflow
    user: "33:33"
    entrypoint: wp
    command: "--info"

volumes:
  mf_db:
  mf_wp:
