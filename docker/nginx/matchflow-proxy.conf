# Optional hardened reverse-proxy snippet for MATCHFLOW (P2).
# Not required for plugin ZIP install on stock WordPress/Apache.
# Mount or include from your host Nginx when terminating TLS in front of Docker.

upstream matchflow_wp {
    server wordpress:80;
}

server {
    listen 443 ssl http2;
    server_name matchflow.example;

    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 32m;

    # Prefer static hashed SPA assets from the plugin build dir (web-server static).
    location ^~ /wp-content/plugins/matchflow/assets/build/ {
        proxy_pass http://matchflow_wp;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Public API alias (rewritten to matchflow/v1 by the plugin).
    location ^~ /api/v1/ {
        proxy_pass http://matchflow_wp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # SPA deep links — plugin template_include serves the shell.
    location / {
        proxy_pass http://matchflow_wp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # Optional: do not expose XML-RPC from the edge.
    location = /xmlrpc.php {
        return 403;
    }
}
