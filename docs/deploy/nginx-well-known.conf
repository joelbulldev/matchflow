# Silence scanner noise for /.well-known (Stripe probes, wildcard bots, etc.)
# Place in your site nginx vhost for matchflow.deepwhale.fun — NOT inside the WordPress plugin.

# Let's Encrypt (adjust webroot if you use certbot webroot mode)
location ^~ /.well-known/acme-challenge/ {
    root /www/wwwroot/matchflow.deepwhale.fun;
    default_type "text/plain";
    try_files $uri =404;
}

# Everything else under .well-known — no error_log spam
location ~ ^/\.well-known/ {
    return 404;
    access_log off;
    log_not_found off;
}
