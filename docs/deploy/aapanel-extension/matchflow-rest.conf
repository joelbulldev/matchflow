# aaPanel: /www/server/panel/vhost/nginx/extension/matchflow.deepwhale.fun/matchflow-rest.conf
# Do NOT duplicate these blocks in the main vhost if this extension is loaded.
# Do NOT add "location /" here — WordPress rewrite include already defines it.

# REST API — must reach index.php (rewrite … last often returns panel HTML 404).
location ^~ /api/v1/ {
    try_files $uri $uri/ /index.php$is_args$args;
}

# SPA build — ^~ wins over "location ~ \.(js|css)$" try_files =404 on aaPanel.
# PHP can also publish physical files under {webroot}/assets/matchflow/ (AssetPublisher).
location ^~ /assets/matchflow/ {
    try_files $uri $uri/ /index.php$is_args$args;
}
