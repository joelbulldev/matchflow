openapi: 3.0.3
info:
  title: MATCHFLOW API
  version: 0.1.0
  description: Public alias /api/v1 maps to WordPress REST matchflow/v1.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /bootstrap:
    get:
      summary: SPA bootstrap (nonce, user, org)
      responses:
        '200':
          description: Bootstrap payload without secrets
  /auth/login:
    post:
      summary: WP cookie session login
      responses:
        '200':
          description: Logged in + restNonce
  /receivables/invoices:
    get:
      summary: List invoices
    post:
      summary: Create invoice
  /public/invoices/{token}:
    get:
      summary: Public invoice by payment token
  /public/invoices/{token}/quotes:
    post:
      summary: Public dry/executable quote
  /settlements/quotes:
    post:
      summary: Authenticated AR/AP settlement quote
  /settlements/{id}/refresh:
    post:
      summary: Poll 1Click status and reconcile on SUCCESS
  /payables/bills/{id}/match:
    post:
      summary: Run deterministic three-way match
  /reconciliation:
    get:
      summary: Matched / unmatched / exceptions
